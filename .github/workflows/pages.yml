name: Publică site-ul (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '_worker.js'
      - '_headers'
      - '_routes.json'
      - '*.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verific cheile Cloudflare
        id: chk
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Lipsesc secretele CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID. Site-ul nu se publică automat."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pregătesc doar fișierele site-ului
        if: steps.chk.outputs.ok == 'true'
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest _worker.js _headers _routes.json \
             favicon.png apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png _site/

      - name: Publică pe Cloudflare Pages (asistent-mai)
        if: steps.chk.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=asistent-mai --branch=main --commit-dirty=true
