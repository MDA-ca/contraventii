name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Copy the web app into the APK
        run: |
          A=android/app/src/main/assets
          mkdir -p "$A"
          cp index.html manifest.webmanifest favicon.png apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png "$A"/

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk asistent-contraventii.apk

      - uses: actions/upload-artifact@v4
        with:
          name: asistent-contraventii-apk
          path: asistent-contraventii.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Asistent contravenții (APK ${{ github.run_number }})
          body: "Descarcă `asistent-contraventii.apk` și instalează-l pe telefon (permite instalarea din surse necunoscute)."
          files: asistent-contraventii.apk
          make_latest: true
